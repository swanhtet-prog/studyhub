<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Hub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">


        <aside class="sidebar">

            <h1>STUDY HUB</h1>

            <nav>
                <button>Dashboard</button>
                <button>Subjects</button>
                <button>Tasks</button>
                <button>Exams</button>
                <button>Progress</button>
            </nav>

        </aside>


     
        <main class="main">

            <header>
                <h2>Welcome back 👋</h2>
                <p>Let's make today productive.</p>
            </header>

            <section class="cards">

                <div class="card">
                    <h3>Subjects</h3>
                    <p>6</p>
                </div>

                <div class="card">
                    <h3>Tasks</h3>
                    <p id="taskCount">0</p>
                </div>

                <div class="card">
                    <h3>Progress</h3>
                    <p id="progress">0%</p>
                </div>

            </section>


          
            <section class="tasks">

                <h2>Today's Tasks</h2>


         
                <div class="add-task">

                    <input
                        type="text"
                        id="taskInput"
                        placeholder="Enter a task"
                    >

                    <button id="addTask">Add Task</button>

                </div>


              
                

            </section>

        </main>

    </div>


    <script src="script2.js"></script>

</body>

</html>
